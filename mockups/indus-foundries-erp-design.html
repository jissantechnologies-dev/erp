<title>Indus Foundries ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
<style>
/* Layout: school-app shell — floating white sidebar card + banner header + big page title + grey tab panel + table with right summary card */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef1; --line:#dfe2e6; --line-strong:#c9cdd3;
  --fg:#1f2328; --fg-2:#4b525b; --fg-3:#7a828c;
  --primary:#1769c7; --primary-ink:#ffffff; --primary-soft:#e5effa;
  --molten:#e8731c;
  --ok:#2e7d32; --ok-soft:#e6f2e7; --warn:#a15c00; --warn-soft:#fdf0db; --bad:#c62828; --bad-soft:#fbe7e7; --info:#1565c0; --info-soft:#e4eefa; --mute-soft:#eceef1;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 2px 8px rgba(20,30,45,.05);
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-display:"Roboto Condensed","Roboto",Arial Narrow,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
  --r:8px; --r-sm:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1d2126; --surface-2:#262b31; --line:#30363d; --line-strong:#424a53;
  --fg:#e7eaee; --fg-2:#b3bac3; --fg-3:#858d97; --primary:#5ea2ef; --primary-ink:#0d1b2b; --primary-soft:#1d3047;
  --ok:#66bb6a; --ok-soft:#1d3320; --warn:#f0b04d; --warn-soft:#3a2c14; --bad:#ef6b6b; --bad-soft:#3d1f1f; --info:#6aaaf0; --info-soft:#1c2f45; --mute-soft:#2a3037;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1d2126; --surface-2:#262b31; --line:#30363d; --line-strong:#424a53;
  --fg:#e7eaee; --fg-2:#b3bac3; --fg-3:#858d97; --primary:#5ea2ef; --primary-ink:#0d1b2b; --primary-soft:#1d3047;
  --ok:#66bb6a; --ok-soft:#1d3320; --warn:#f0b04d; --warn-soft:#3a2c14; --bad:#ef6b6b; --bad-soft:#3d1f1f; --info:#6aaaf0; --info-soft:#1c2f45; --mute-soft:#2a3037;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";vertical-align:middle;width:1em;overflow:hidden;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}

/* shell */
.app{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:16px;min-height:100%}
.side{position:sticky;top:16px;align-self:start;height:calc(100vh - 32px);width:264px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:width .2s}
.side-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.logo{width:36px;height:36px;border-radius:8px;flex:none;background:radial-gradient(circle at 50% 70%,#ffb15c 0,#e8731c 38%,#7a2e06 75%);display:grid;place-items:center;color:#fff;font:700 15px var(--f-display)}
.brand-t{font:700 15px var(--f-display);letter-spacing:.04em;line-height:1.1}
.brand-s{font-size:11px;color:var(--fg-3)}
.side-collapse{position:absolute;right:-18px;top:56px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;z-index:3}
.nav{overflow-y:auto;padding:6px 10px 16px;flex:1}
.nav-group{margin-top:2px}
.nav-head,.nav-item{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;cursor:pointer;border-radius:8px;color:var(--fg)}
.nav-head{padding:10px 10px;font-weight:500}
.nav-head .ms{color:var(--fg-2)}
.nav-head .chev{margin-left:auto;font-size:18px;color:var(--fg-3);transition:transform .15s}
.nav-group.open .chev{transform:rotate(90deg)}
.nav-head:hover,.nav-item:hover{background:var(--surface-2)}
.nav-items{display:none;padding:2px 0 6px}
.nav-group.open .nav-items{display:block}
.nav-item{padding:7px 10px 7px 44px;font-size:13.5px;color:var(--fg-2)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:500}
.nav-group.current>.nav-head{color:var(--primary)} .nav-group.current>.nav-head .ms{color:var(--primary)}
.side.mini{width:72px}
.side.mini .brand-t,.side.mini .brand-s,.side.mini .nav-head span.lbl,.side.mini .chev,.side.mini .nav-items{display:none}
.side.mini .nav-head{justify-content:center}
.side.mini .side-collapse .ms{transform:rotate(180deg)}

.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.banner{position:relative;border-radius:12px;overflow:hidden;min-height:112px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px 18px 30px;
  background:
   linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.9) 34%,rgba(255,255,255,.35) 62%,rgba(255,255,255,0) 80%),
   radial-gradient(ellipse 22% 60% at 82% 88%,rgba(255,170,70,.95),rgba(232,115,28,.6) 40%,transparent 70%),
   radial-gradient(ellipse 12% 30% at 70% 95%,rgba(255,200,110,.7),transparent 70%),
   linear-gradient(180deg,#5b6068 0%,#3a3e44 55%,#2a2b2e 100%)}
.banner svg.plant{position:absolute;right:0;bottom:0;height:100%;width:62%;opacity:.55;pointer-events:none}
.banner h1{margin:0;font:700 clamp(26px,4.2vw,50px)/1 var(--f-display);letter-spacing:.01em;color:#1d2125;position:relative}
.banner .loc{font-size:18px;color:#4d545c;margin-top:6px;position:relative}
.userpill{position:relative;display:flex;align-items:center;gap:12px;background:rgba(240,241,243,.92);border-radius:12px;padding:8px 10px 8px 16px;border:0;cursor:pointer;color:#1d2125;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;background:#c8ccd2;color:#fff;display:grid;place-items:center;font-weight:500}
.banner .menu-btn{display:none}

.page{display:flex;flex-direction:column;gap:18px;padding:0 4px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg-3);flex-wrap:wrap}
.crumbs a{color:var(--fg-2);text-decoration:none;cursor:pointer} .crumbs a:hover{color:var(--primary);text-decoration:underline}
.ptitle-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ptitle{margin:2px 0 0;font:500 34px/1.1 var(--f-display);color:var(--fg-2);text-wrap:balance}
.ptitle small{display:block;font:400 14px var(--f-body);color:var(--fg-3);margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.btn .ms{font-size:18px}
.btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 1px 3px rgba(23,105,199,.3)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--primary)}
.btn-outline:hover{background:var(--primary-soft)}
.btn-ghost{background:none;color:var(--fg-2);padding:0 10px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line-strong);color:var(--bad)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--primary)}

.tabs{background:var(--surface-2);border-radius:12px;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:22px 18px 19px;font-weight:500;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--fg-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab .count{display:inline-block;margin-left:6px;font-size:11.5px;background:var(--surface);color:var(--fg-2);padding:1px 7px;border-radius:10px}

.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split.wide-side{grid-template-columns:minmax(0,1fr) 380px}
.card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px;flex-wrap:wrap}
.card-h h2{margin:0;font:400 24px var(--f-body);color:var(--fg-2)}
.card-h h3{margin:0;font-size:16px;font-weight:500}
.card-b{padding:14px 20px 20px}
.section-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500;margin:0 0 10px}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;padding:12px 20px}
.field-o{position:relative;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);display:flex;align-items:center;min-height:46px}
.field-o.search{flex:1 1 260px}
.field-o input,.field-o select{border:0;background:none;outline:0;padding:0 12px;height:44px;width:100%}
.field-o .ms{color:var(--fg-2);padding-right:10px}
.field-o.lab{flex-direction:column;align-items:stretch;justify-content:center;padding:4px 0 2px}
.field-o.lab label{font-size:11.5px;color:var(--fg-3);padding:0 12px}
.field-o.lab select,.field-o.lab input{height:24px;font-size:14px}
.field-o:focus-within{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 10px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:16px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--fg-2)}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--primary);font-weight:500}

/* table */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--fg);padding:14px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:relative;background:var(--surface)}
.tbl th+th::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--primary-soft)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .link{color:var(--primary);font-weight:500}
.tbl .sub{display:block;font-size:12px;color:var(--fg-3)}
.cb{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;font-size:13px;color:var(--fg-2);flex-wrap:wrap}
.pager{display:flex;gap:4px;align-items:center}
.pager button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer}
.pager button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
tfoot td{font-weight:500;background:var(--surface-2)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--info-soft);color:var(--info)} .b-mute{background:var(--mute-soft);color:var(--fg-2)}
.st-text{font-weight:500}
.st-ok{color:var(--ok)} .st-bad{color:var(--bad)} .st-warn{color:var(--warn)}

/* summary side card */
.sum h2{margin:0 0 14px;font:400 26px var(--f-body);color:var(--fg)}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.kv .k{font-size:11.5px;color:var(--fg-3)}
.kv .v{font-size:15px;font-weight:500}
.bigstat{font:500 22px var(--f-display);color:var(--fg-2)}
.bigstat b{color:var(--fg);font-weight:700}
.legend-row{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;padding:6px 0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.dot .ms{font-size:16px}
.hint{padding:28px 20px;text-align:center;font-size:17px;font-weight:500;color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:20px}
.bar-h{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bar-h .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-h .fill{height:100%;background:var(--primary);border-radius:4px}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px}
.form-grid .span2{grid-column:span 2} .form-grid .span3{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:12.5px;color:var(--fg-2);font-weight:500}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{height:40px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 12px;background:var(--surface);width:100%}
.f textarea{height:84px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.f input[readonly]{background:var(--surface-2);color:var(--fg-2)}
.f .help{font-size:12px;color:var(--fg-3)}
.f.err input{border-color:var(--bad)} .f.err .help{color:var(--bad)}
.form-sec{padding:20px;border-top:1px solid var(--line)}
.form-sec:first-child{border-top:0}
.form-sec h3{margin:0 0 14px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.form-sec h3 .ms{color:var(--primary)}
.form-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:22px;text-align:center;color:var(--fg-2);background:var(--surface-2)}
.drop .ms{font-size:34px;color:var(--primary)}
.drop b{color:var(--primary)}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.file .ext{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--f-mono);color:#fff;flex:none}
.file .meta{flex:1;min-width:0}
.file .meta div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta div:last-child{font-size:12px;color:var(--fg-3)}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px}
.dl .k{font-size:12px;color:var(--fg-3)} .dl .v{font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--primary-soft);color:var(--primary);font-weight:500}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 26px;font-size:13px}
.tl li::before{content:"";position:absolute;left:6px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:1px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl li.done::after{background:var(--ok);border-color:var(--ok)}
.tl li.now::after{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.tl .t{font-weight:500} .tl .d{color:var(--fg-3);font-size:12px}

.stepper{display:flex;align-items:center;gap:0;padding:18px 20px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;color:var(--fg-3)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);font-weight:500;font-size:12px}
.step.done{color:var(--fg)} .step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{color:var(--primary);font-weight:500} .step.now .n{border-color:var(--primary);color:var(--primary)}
.step-line{flex:1;min-width:30px;height:2px;background:var(--line);margin:0 10px}
.step-line.done{background:var(--ok)}

.notes{display:flex;flex-direction:column;gap:14px}
.note{display:flex;gap:12px}
.note .avatar{width:32px;height:32px;font-size:13px;background:var(--primary)}
.note .bubble{background:var(--surface-2);border-radius:0 10px 10px 10px;padding:10px 12px;flex:1}
.note .who{font-size:12.5px;font-weight:500} .note .who span{color:var(--fg-3);font-weight:400;margin-left:6px}

/* calendar strip */
.cal{display:grid;grid-template-columns:200px repeat(8,minmax(76px,1fr));font-size:12.5px;min-width:900px}
.cal div{padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal .ch{font-weight:500;background:var(--surface-2);text-align:center}
.cal .ch.first{text-align:left}
.cal .rowh{font-weight:500}
.cal .rowh span{display:block;font-weight:400;color:var(--fg-3);font-size:12px}
.cal .q{text-align:center}
.cal .q b{display:block;border-radius:4px;padding:4px 0;font-weight:500}
.q-done b{background:var(--ok-soft);color:var(--ok)} .q-due b{background:var(--warn-soft);color:var(--warn)} .q-late b{background:var(--bad-soft);color:var(--bad)} .q-plan b{background:var(--info-soft);color:var(--info)}
.cal .today{background:var(--primary-soft)}

/* empty / loading / error */
.empty{padding:56px 20px;text-align:center;color:var(--fg-2)}
.empty .ill{width:76px;height:76px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px}
.empty .ill .ms{font-size:36px;color:var(--fg-3)}
.empty h3{margin:0 0 6px;color:var(--fg);font-size:17px;font-weight:500}
.empty p{margin:0 auto 16px;max-width:44ch}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.alert .ms{font-size:20px}
.alert-bad{background:var(--bad-soft);color:var(--bad)} .alert-info{background:var(--info-soft);color:var(--info)} .alert-warn{background:var(--warn-soft);color:var(--warn)}
.alert div{color:var(--fg)} .alert b{display:block;margin-bottom:2px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,20,28,.48);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:18px;font-weight:500}
.modal-b{padding:20px}
.modal .form-grid{grid-template-columns:1fr 1fr}

/* ---------- render + events ---------- */
function render(){
  const r=state.route.startsWith("soon:")?"soon":state.route;
  document.getElementById("page").innerHTML=(P[r]||P.enquiries)();
  renderNav();
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest(".scrim")&&(t.matches("[data-close]")||t.closest("button[data-close]"))){const b=t.closest("[data-toast]");document.getElementById("layer").innerHTML="";if(b)toast(b.dataset.toast);return}
  if(t.closest("[data-stop]")||t.matches(".cb")) return;
  const grp=t.closest("[data-grp]");
  if(grp){const k=grp.dataset.grp;const side=document.getElementById("side");
    if(k==="dashboard"){go("dashboard");return}
    if(side.classList.contains("mini")){side.classList.remove("mini");state.open.add(k)}else{state.open.has(k)?state.open.delete(k):state.open.add(k)}
    renderNav();return}
  const tab=t.closest("[data-tab]");if(tab){state.tab=+tab.dataset.tab;render();return}
  const m=t.closest("[data-modal]");if(m){openModal(m.dataset.modal);return}
  const g=t.closest("[data-go]");if(g&&g.dataset.go){go(g.dataset.go,g.dataset.id||null);return}
  const ts=t.closest("[data-toast]");if(ts){toast(ts.dataset.toast);return}
  const chip=t.closest(".chip");if(chip){chip.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));chip.classList.add("on");return}
  const sg=t.closest(".seg button");if(sg&&!sg.dataset.toast){return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("layer").innerHTML=""});
document.getElementById("collapse").onclick=()=>document.getElementById("side").classList.toggle("mini");
document.getElementById("menuBtn").onclick=()=>document.getElementById("side").classList.toggle("mobile-open");

function barChart(labels,series,o={}){const W=560,H=o.h||200,pl=40,pb=24,pt=10,max=o.max;const cw=(W-pl-6)/labels.length;const bw=Math.min(24,(cw-12)/series.length);const y=v=>pt+(H-pt-pb)*(1-v/max);
 let g="";for(let t=0;t<=4;t++){const v=max*t/4;g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${fmtN(v)}${o.unit||""}</text>`}
 labels.forEach((l,i)=>{const x0=pl+i*cw+(cw-bw*series.length)/2;series.forEach((s,j)=>{const v=s.v[i];g+=`<rect x="${x0+j*bw}" y="${y(v)}" width="${bw-3}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${s.c}"/>`});g+=`<text x="${pl+i*cw+cw/2}" y="${H-7}" text-anchor="middle">${l}</text>`});
 if(o.line){const s=o.line;let pts=labels.map((l,i)=>`${pl+i*cw+cw/2},${pt+(H-pt-pb)*(1-s.v[i]/s.max)}`).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2"/>`+labels.map((l,i)=>`<circle cx="${pl+i*cw+cw/2}" cy="${pt+(H-pt-pb)*(1-s.v[i]/s.max)}" r="3" fill="${s.c}"/>`).join("")+`<text x="${W-4}" y="${pt+8}" text-anchor="end">${s.n} (right axis, max ${s.max}%)</text>`}
 return `${cLeg(o.line?[...series,{n:o.line.n,c:o.line.c}]:series)}<svg viewBox="0 0 ${W} ${H}" width="100%" font-size="10" fill="var(--fg-3)" role="img" aria-label="${o.label||"Bar chart"}">${g}</svg>`}
function lineChart(labels,series,o={}){const W=560,H=o.h||200,pl=40,pb=24,pt=10,max=o.max,min=o.min||0;const cw=(W-pl-14)/(labels.length-1);const y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));const x=i=>pl+6+i*cw;
 let g="";for(let t=0;t<=4;t++){const v=min+(max-min)*t/4;g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${fmtN(v)}${o.unit||""}</text>`}
 labels.forEach((l,i)=>{if(labels.length<=12||i%2===0)g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${l}</text>`});
 if(o.target!=null)g+=`<line x1="${pl}" x2="${W-4}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="${W-6}" y="${y(o.target)-4}" text-anchor="end" fill="var(--bad)">Target ${o.target}${o.unit||""}</text>`;
