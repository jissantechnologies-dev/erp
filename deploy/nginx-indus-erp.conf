# erpdemo.gvndemo.com — Indus ERP (new NestJS/React build).
# Separate from /etc/nginx/sites-enabled/foundry-erp, which serves the live
# induserp/kingstonerp/jissanerp tenants. Do not merge the two.
server {
    server_name erpdemo.gvndemo.com;

    root /opt/indus-erp/web;
    index index.html;

    client_max_body_size 25m;

    access_log /var/log/nginx/indus-erp.access.log;
    error_log  /var/log/nginx/indus-erp.error.log;

    # API first, so it is not shadowed by the SPA fallback below.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path must return index.html, or a
    # deep link such as /app/masters/parts would 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erpdemo.gvndemo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erpdemo.gvndemo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = erpdemo.gvndemo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name erpdemo.gvndemo.com;
    return 404; # managed by Certbot


}