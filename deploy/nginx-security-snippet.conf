# Installed at /etc/nginx/snippets/indus-erp-security.conf
#
# Kept in a snippet and included in EVERY location that defines its own
# add_header, because nginx discards inherited add_header directives as soon as
# a nested block declares one of its own. `always` applies them to error
# responses too, not just 2xx/3xx.
#
# HSTS deliberately omits includeSubDomains: this host is a sibling of the live
# induserp/kingstonerp/jissanerp sites, and forcing HTTPS on those from here
# would be both out of scope and hard to undo (browsers cache the policy).
# max-age is 180 days.
add_header Strict-Transport-Security "max-age=15552000" always;

# Stop browsers MIME-sniffing a response away from its declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# No framing: this is an internal ERP, it is never embedded elsewhere.
add_header X-Frame-Options "DENY" always;

# Send the full referrer only to this same origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
